name: Update Problems Solved Counter

on:
  push:
    branches:
      - main  # Change this if your default branch is different

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Count total manual commits (problems solved)
        id: problem_count
        run: |
          # Count commits that were NOT made by GitHub Actions
          TOTAL_COMMITS=$(git log --oneline --pretty=format:"%H %an" | grep -v "github-actions" | wc -l)

          # Ensure the count doesn't go negative
          NEW_COUNT=$(TOTAL_COMMITS)
          
          echo "NEW_COUNT=$NEW_COUNT" >> $GITHUB_ENV

      - name: Update Problems Solved Counter in README.md
        run: |
          FILE="README.md"
          sed -i "s/### Problems Solved: .*/### Problems Solved: $NEW_COUNT/" "$FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update problems solved count to $NEW_COUNT" || exit 0
          git push
