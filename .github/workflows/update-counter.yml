name: Update Problems Solved Counter

on:
  push:
    branches:
      - main  # Change this if your default branch is different

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Count total manual commits (problems solved)
        id: problem_count
        run: |
          # Count commits that were made by humans, excluding bot commits (like GitHub Actions)
          TOTAL_COMMITS=$(git log --oneline --pretty=format:"%H %an" | grep -v "github-actions" | wc -l)

          # Export the variable to make it available to the next steps
          echo "NEW_COUNT=$TOTAL_COMMITS" >> $GITHUB_ENV

      - name: Update Problems Solved Counter in README.md
        run: |
          # Ensure the variable is available
          echo "Problems Solved: $NEW_COUNT"
          
          # Update the 'Problems Solved' line in README.md
          sed -i "s/### Problems Solved: .*/### Problems Solved: $NEW_COUNT/" README.md

      - name: Commit and Push Changes
        run: |
          # Configure Git
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
    
          # Set up authentication using GitHub Token
          echo "${{ secrets.GH_TOKEN }}" | git credential approve

          # Commit changes if there are any
          git add README.md
          git commit -m "Update problems solved count to $NEW_COUNT" || exit 0  # Exit 0 to avoid failing if there's no change
          git push https://github.com/YoussefOS2510/Problem-Solving.git
